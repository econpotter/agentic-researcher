# Acquisition/expansion policy + openbrain connection.
# See docs/superpowers/specs/2026-06-28-agentic-researcher-acquisition-design.md (§4 + Revision).

citation_expansion: false        # enable `researcher expand` (follow citations outward)
relevance_radius: 0.40           # min similarity to a topic's core papers to keep a paper (first knob to tune)
max_citation_distance: 2         # how many citation hops from a core paper
max_papers_per_run: 200          # hard ceiling on papers added per expand run
core_bootstrap_count: 10         # core papers seeded when creating a topic from the library

# Hosted openbrain, reached over the SSH tunnel (the local checkout is dev-only).
openbrain_mcp_url: "https://rhythm.herknet:8443/mcp"   # <-- set to your tunneled MCP endpoint
openbrain_ca_cert: "/home/potterzot/caddy-rhythm.crt"  # CA cert if MCP uses self-signed TLS (else null)
# bearer token is read from the OPENBRAIN_MCP_TOKEN environment variable, not this file
