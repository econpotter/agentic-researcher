[project]
name = "agentic-researcher"
version = "0.1.0"
description = "Automated economics-research driver over openbrain"
requires-python = ">=3.11"
dependencies = ["tomli-w>=1.0", "pyyaml>=6.0", "fastmcp>=2.0", "python-dotenv>=1.0"]

[project.scripts]
researcher = "researcher.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ARG002 (unused method argument) is dropped, ARG001 (unused function argument) kept. Ruling of 2026-09-08 during the refactor trial: a method implementing a shared interface has to take that interface's arguments.
select = ["E", "F", "I", "UP", "B", "SIM", "ARG001", "ERA", "T20", "PD"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
timeout = 5
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
